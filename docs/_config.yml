# Book settings
# Learn more at https://jupyterbook.org/customize/config.html

title: Xarray-binfile
author: Felipe N. Schuch
copyright: "2025-2026"
description: Read and write raw binary files using the familiar interface from the Xarray library
logo: logo.png

# Force re-execution of notebooks on each build.
# See https://jupyterbook.org/content/execute.html
execute:
  execute_notebooks: force
  stderr_output: remove
  allow_errors: false
  timeout: 120

# Define the name of the latex output file for PDF builds
latex:
  latex_documents:
    targetname: book.tex

# Add a bibtex file so that we can create citations
bibtex_bibfiles:
  - references.bib

# Information about where the book exists on the web
repository:
  url: https://github.com/fschuch/xarray-binfile # Online location of your book
  path_to_book: docs # Optional path to your book, relative to the repository root
  branch: main # Which branch of the repository should be used when creating links (optional)

# Add GitHub buttons to your book
# See https://jupyterbook.org/customize/config.html#add-a-link-to-your-repository
html:
  home_page_in_navbar: false
  use_edit_page_button: true
  use_issues_button: true
  use_repository_button: true
  announcement: Found a problem with a file layout or metadata convention? Please report it on GitHub.

sphinx:
  extra_extensions:
    - sphinx_github_changelog
    - sphinx.ext.autodoc
    - sphinx.ext.intersphinx
    - sphinx.ext.napoleon
  config:
    #https://github.com/executablebooks/jupyter-book/issues/1950#issuecomment-1454801479
    suppress_warnings: ["mystnb.unknown_mime_type"]

    intersphinx_mapping:
      python:
        - "https://docs.python.org/3"
        - null
      numpy:
        - "https://numpy.org/doc/stable/"
        - null
      xarray:
        - "https://docs.xarray.dev/en/stable/"
        - null
      dask:
        - "https://docs.dask.org/en/stable/"
        - null

    napoleon_include_special_with_doc: true
    napoleon_google_docstring: true
    napoleon_numpy_docstring: false
    # Render "Attributes:" sections as :ivar: fields instead of .. attribute::
    # directives, so they do not clash with the members autodoc documents
    # (which raises "duplicate object description" warnings otherwise)
    napoleon_use_ivar: true

    html_theme_options:
      icon_links:
        # - name: "Stars"
        #   url: "https://github.com/fschuch/xarray-binfile/"
        #   icon: "https://img.shields.io/github/stars/fschuch/xarray-binfile?style=social"
        #   type: "url"
        - name: "Releases"
          url: "https://github.com/fschuch/xarray-binfile/releases"
          icon: "https://img.shields.io/github/v/release/fschuch/xarray-binfile?style=social"
          type: "url"
